# Chi-Spark AI — security response headers
#
# Drop-in snippet. Include it inside the HTTPS `server { }` block:
#
#     include /etc/nginx/snippets/chispark-security-headers.conf;
#
# Apply with:  nginx -t && systemctl reload nginx
#
# Note on `always`: without it, nginx omits these headers on error responses
# (401/403/404/5xx). The portal returns 401 constantly, so `always` matters here.

# --- HTTPS enforcement -------------------------------------------------------
# Tells browsers to never speak plain HTTP to this host again. Without it, the
# very first request a user makes after typing "chisparkai.org" is cleartext and
# can be downgraded before our 301 ever runs.
#
# includeSubDomains commits every future subdomain (portal., app., ...) to HTTPS
# permanently. That is the intent, but it is a real commitment — a subdomain
# served over plain HTTP after this will simply refuse to load.
#
# Rollout: ship with max-age=300 first, confirm nothing breaks for a day, then
# raise to the 31536000 (1 year) line below. Do not add `preload` until the
# long max-age has been stable for a while — preload is very hard to reverse.
add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- Already set today, kept here so the whole set lives in one file ---------
add_header X-Frame-Options            "DENY"                            always;
add_header X-Content-Type-Options     "nosniff"                         always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

# --- Capability lockdown -----------------------------------------------------
# The portal needs none of these. Denying them limits what injected script could
# reach for, and costs nothing.
add_header Permissions-Policy
  "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
  always;

# --- Content Security Policy -------------------------------------------------
# Scoped to what the app actually loads, verified against the live page:
#
#   script-src  'self'          — no inline or third-party scripts
#   style-src   + unsafe-inline — React inline style= attributes need this
#   font-src    + gstatic       — Google Fonts, linked from index.html
#   img-src     + data: blob:   — REQUIRED by the portal: the 2FA QR code is a
#                                 data: URL (QRCode.toDataURL) and the recovery
#                                 code download is a blob: URL. Dropping either
#                                 silently breaks 2FA enrolment.
#   connect-src 'self'          — the API is same-origin
#
# ROLLOUT — do not enforce this blind. Ship Report-Only first (below), open the
# site and the portal, walk through 2FA setup and a recovery-code download, and
# watch the browser console for violation reports. Only once it is silent do you
# swap to the enforcing header.
add_header Content-Security-Policy-Report-Only
  "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests"
  always;

# Enforcing version — enable only after Report-Only has been clean.
# add_header Content-Security-Policy
#   "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; upgrade-insecure-requests"
#   always;
